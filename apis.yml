aid: lordandtaylor
name: Lord & Taylor
description: >-
  Lord & Taylor is one of the oldest American department-store apparel and home-goods
  retail brands, now operating as a direct-to-consumer online store at lordandtaylor.com.
  The storefront runs on the Shopify commerce platform, so its public, agent-accessible
  API surface is the Shopify commerce stack: OAuth 2.0 / OpenID Connect customer
  authentication (issued via Shopify Customer Accounts) plus two hosted Model Context
  Protocol (MCP) servers — an unauthenticated Storefront MCP exposing product search,
  cart, product-detail and store-policy tools, and an OAuth-protected Customer Account
  MCP exposing order-status, return-request and store-credit tools. Surfaced into the
  API Evangelist network as a portfolio-lead stub and enriched from live discovery
  documents and MCP tool listings.
